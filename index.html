<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Script intelligenti</title>
  <style>
    :root { --bg: #fafaf7; --fg: #1d1d1b; --muted: #6b6b66; --accent: #2b5cab; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161615; --fg: #ecece8; --muted: #9a9a94; --accent: #7fa6e8; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-size: 2.2rem; margin: 0 0 .25em; }
    p.sub { color: var(--muted); margin-top: 0; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Script intelligenti</h1>
    <p class="sub">Materiali del corso di formazione – Istituto Galilei</p>
    <p>Qui troverai schede, dataset e materiali degli incontri. Pagina in costruzione.</p>
  </main>
</body>
</html>
